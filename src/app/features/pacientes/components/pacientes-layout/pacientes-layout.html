<app-sidebar
  [nombre]="usuario.nombre"
  [rol]="usuario.rol"
  [iniciales]="usuario.iniciales"
  [esAdmin]="esAdmin"
  [esMedico]="esMedico"
  [abierto]="sidebarAbierto">
</app-sidebar>

<div class="sidebar-overlay" *ngIf="sidebarAbierto" (click)="sidebarAbierto = false"></div>

<div class="main-wrapper">
  <app-header
    [titulo]="pageTitle"
    [subtitulo]="pageSubtitle"
    placeholder="Buscar paciente por DNI, nombre..."
    [notificaciones]="3"
    [nombre]="usuario.nombre"
    [rol]="usuario.rol"
    [iniciales]="usuario.iniciales"
    (menuToggle)="toggleSidebar()">
  </app-header>

  <main class="content">
    <ng-content></ng-content>
  </main>
</div>
