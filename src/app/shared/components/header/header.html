<header class="top-header" role="banner">
  <!-- Título y subtítulo de la vista -->
  <div class="header-titles">
    <h1 class="view-title">Usuarios</h1>
    <span class="view-subtitle">Gestión de cuentas del personal</span>
  </div>

  <!-- Buscador global -->
  <div class="header-search">
    <div class="search-input-wrapper">
      <lucide-icon [img]="iconSearch" class="search-icon"></lucide-icon>
      <input
        type="search"
        class="search-input"
        placeholder="Buscar usuario por nombre o correo..."
        [value]="usuarioService.busqueda()"
        (input)="onSearchChange($event)"
        aria-label="Buscar usuario por nombre o correo"
      />
    </div>
  </div>

  <!-- Acciones: Notificaciones y Perfil -->
  <div class="header-actions">
    <!-- Botón Notificaciones con badge -->
    <button
      type="button"
      class="icon-button notification-button"
      aria-label="Notificaciones"
      title="3 notificaciones pendientes"
    >
      <lucide-icon [img]="iconBell"></lucide-icon>
      <span class="notification-badge">3</span>
    </button>

    <div class="divider" aria-hidden="true"></div>

    <!-- Menú del usuario -->
    <div class="user-menu-chip" role="button" tabindex="0" aria-label="Menú del Dr. Juan Pérez">
      <div class="avatar-badge" aria-hidden="true">JP</div>
      <span class="user-fullname">Dr. Juan Pérez</span>
      <lucide-icon [img]="iconChevronDown" class="chevron-icon"></lucide-icon>
    </div>
  </div>
</header>
