<header class="top-header">
  <button class="btn-menu" (click)="menuToggle.emit()" type="button" aria-label="Abrir menú">
    <span class="material-symbols-outlined">menu</span>
  </button>
  <div class="header-title">
    <span class="header-heading">{{ titulo }}</span>
    <span class="header-subtitle">{{ subtitulo }}</span>
  </div>

  <div class="search-box">
    <span class="material-symbols-outlined search-icon">search</span>
    <input
      type="search"
      [placeholder]="placeholder"
      [value]="usuarioService?.busqueda() || ''"
      (input)="onSearchChange($event)"
      aria-label="Buscar"
    />
  </div>

  <div class="header-actions">
    <button class="btn-notification" type="button" title="Notificaciones" aria-label="Notificaciones">
      <span class="material-symbols-outlined">notifications</span>
      <span class="notification-badge" *ngIf="notificaciones > 0">{{ notificaciones }}</span>
    </button>
    <div class="user-profile">
      <div class="profile-avatar">{{ iniciales }}</div>
      <div class="profile-info">
        <span class="profile-name">{{ nombre }}</span>
        <span class="profile-role" *ngIf="rol">{{ rol }}</span>
      </div>
      <span class="material-symbols-outlined">expand_more</span>
    </div>
  </div>
</header>
