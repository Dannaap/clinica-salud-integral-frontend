<header class="top-header">
  <button class="btn-menu" (click)="menuToggle.emit()" type="button">
    <span class="material-symbols-outlined">menu</span>
  </button>
  <div class="header-title">
    <span class="header-heading">{{ titulo }}</span>
    <span class="header-subtitle">{{ subtitulo }}</span>
  </div>

  <div class="search-box">
    <span class="material-symbols-outlined search-icon">search</span>
    <input #inputBusqueda type="search" [placeholder]="placeholder" (keyup.enter)="buscar(inputBusqueda.value)">
  </div>

  <div class="header-actions">
    <button class="btn-notification" title="Notificaciones" type="button" (click)="mostrarNotificaciones()">
      <span class="material-symbols-outlined">notifications</span>
      <span class="notification-badge">{{ notificaciones }}</span>
    </button>
  </div>
</header>
