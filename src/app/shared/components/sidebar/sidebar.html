<aside class="sidebar-container" aria-label="Navegación principal">
  <!-- Cabecera Institucional -->
  <div class="sidebar-header">
    <div class="logo-box">
      <lucide-icon [img]="iconPlus" class="logo-icon"></lucide-icon>
    </div>
    <div class="logo-details">
      <h2 class="brand-name">Clínica Salud Integral</h2>
      <span class="brand-tag">S.A.C. • ADMIN</span>
    </div>
  </div>

  <!-- Menú de Navegación -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      @for (item of navItems; track item.route) {
        <li class="nav-item">
          <a
            [routerLink]="item.route"
            routerLinkActive="is-active"
            class="nav-link"
          >
            <lucide-icon [img]="item.icon" class="link-icon"></lucide-icon>
            <span class="link-text">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Perfil en el pie del Sidebar -->
  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-avatar" aria-hidden="true">JP</div>
      <div class="user-details">
        <strong class="user-name">Dr. Juan Pérez</strong>
        <span class="user-role">Administrador</span>
      </div>
      <button
        type="button"
        class="logout-btn"
        (click)="cerrarSesion()"
        title="Cerrar sesión"
        aria-label="Cerrar sesión"
      >
        <lucide-icon [img]="iconLogOut"></lucide-icon>
      </button>
    </div>
  </div>
</aside>
