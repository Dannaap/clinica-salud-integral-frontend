<aside class="sidebar" [class.abierto]="abierto" aria-label="Navegación principal">
  <div class="sidebar-header">
    <span class="material-symbols-outlined logo-icon">local_hospital</span>
    <div class="brand-text">
      <span class="brand-name">Clínica Salud Integral</span>
      <span class="brand-sub">S.A.C. • {{ rol }}</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a [routerLink]="rutaDashboard" routerLinkActive="active" class="nav-item">
      <span class="material-symbols-outlined">home</span>
      <span>Inicio</span>
    </a>
    <a routerLink="/pacientes" routerLinkActive="active" class="nav-item" *ngIf="!esMedico">
      <span class="material-symbols-outlined">group</span>
      <span>Pacientes</span>
    </a>
    <button
      type="button"
      class="nav-item nav-item-disabled"
      (click)="mostrarProximamente('Citas')"
    >
      <span class="material-symbols-outlined">calendar_month</span>
      <span>Citas</span>
    </button>
    <button
      type="button"
      class="nav-item nav-item-disabled"
      (click)="mostrarProximamente('Turnos médicos')"
      *ngIf="esAdmin"
    >
      <span class="material-symbols-outlined">stethoscope</span>
      <span>Turnos médicos</span>
    </button>
    <button
      type="button"
      class="nav-item nav-item-disabled"
      (click)="mostrarProximamente('Atenciones')"
      *ngIf="esAdmin || esMedico"
    >
      <span class="material-symbols-outlined">assignment</span>
      <span>Atenciones</span>
    </button>
    <button
      type="button"
      class="nav-item nav-item-disabled"
      (click)="mostrarProximamente('Reportes')"
    >
      <span class="material-symbols-outlined">bar_chart</span>
      <span>Reportes</span>
    </button>
    <a routerLink="/usuarios" routerLinkActive="active" class="nav-item" *ngIf="esAdmin">
      <span class="material-symbols-outlined">manage_accounts</span>
      <span>Usuarios</span>
    </a>
    <button
      type="button"
      class="nav-item nav-item-disabled"
      (click)="mostrarProximamente('Perfil')"
    >
      <span class="material-symbols-outlined">account_circle</span>
      <span>Perfil</span>
    </button>
  </nav>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar">{{ iniciales }}</div>
      <div class="user-info">
        <span class="user-name">{{ nombre }}</span>
        <span class="user-role">{{ rol }}</span>
      </div>
    </div>
    <button class="btn-logout" (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</aside>
